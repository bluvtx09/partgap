name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          git clone https://github.com/Rhoban/bam external/bam
          git -C external/bam checkout -q e9a619d56da5236206f4de6ceec2c1ee1b497b5c
      - run: pip install numpy==2.4.4 pytest==9.1.1 -e .
      - run: pytest -q
